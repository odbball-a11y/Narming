<title>Grid Tactics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: board on the left, a command panel on the right; stacked on phones. Same palette as the rulebook. */
:root {
  --bg: #eef1f5; --panel: #ffffff; --ink: #18212c; --muted: #566273; --line: #cfd6df;
  --blue: #2a66cc; --blue-soft: #dbe6f8; --orange: #d9661a; --orange-soft: #fbe3d2;
  --tile-a: #e3e8ee; --tile-b: #d6dde5; --wall: #3a4452; --high: #b7c98a; --high-line: #93ab5c;
  --gold: #c99a12; --gold-soft: #f6ebc8; --hit: #cf2f3f; --move: rgba(42,102,204,.28); --on-team: #ffffff;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10151c; --panel: #18202a; --ink: #e5eaf0; --muted: #98a4b3; --line: #2c3642;
  --blue: #5b93f0; --blue-soft: #1b2b45; --orange: #f08a43; --orange-soft: #3b2415;
  --tile-a: #222b36; --tile-b: #1b232d; --wall: #6a7686; --high: #4f6130; --high-line: #6c8441;
  --gold: #e2b734; --gold-soft: #3a3115; --hit: #ff5d6c; --move: rgba(91,147,240,.32); --on-team: #0d1218; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #10151c; --panel: #18202a; --ink: #e5eaf0; --muted: #98a4b3; --line: #2c3642;
  --blue: #5b93f0; --blue-soft: #1b2b45; --orange: #f08a43; --orange-soft: #3b2415;
  --tile-a: #222b36; --tile-b: #1b232d; --wall: #6a7686; --high: #4f6130; --high-line: #6c8441;
  --gold: #e2b734; --gold-soft: #3a3115; --hit: #ff5d6c; --move: rgba(91,147,240,.32); --on-team: #0d1218; color-scheme: dark; }

body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); }
.app { max-width: 1060px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 24px; align-items: start; }
h1 { font: 800 30px/1 var(--f-display); margin: 0; letter-spacing: -.01em; }
h1 .b { color: var(--blue); } h1 .o { color: var(--orange); }
.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.top a { color: var(--muted); font-size: 14px; }

/* Board */
.boardwrap { position: relative; }
#board { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); border-radius: 10px; overflow: hidden; border: 2px solid var(--line); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.cell { position: relative; aspect-ratio: 1; border: 0; padding: 0; margin: 0; background: var(--tile-a); cursor: default; display: grid; place-items: center; font: inherit; color: inherit; }
.cell.alt { background: var(--tile-b); }
.cell.wall { background: var(--wall); }
.cell.high { background: repeating-linear-gradient(45deg, var(--high) 0 7px, var(--high-line) 7px 10px); }
.cell:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; z-index: 2; }
.cell .coord { position: absolute; font: 500 9px/1 var(--f-mono); color: var(--muted); pointer-events: none; }
.cell .coord.r { top: 3px; left: 3px; } .cell .coord.c { bottom: 3px; right: 4px; }
.cell .cp { position: absolute; width: 56%; height: 56%; transform: rotate(45deg); background: var(--gold-soft); border: 3px solid var(--gold); border-radius: 3px; }
.cell .base { position: absolute; inset: 7%; border-radius: 7px; border: 3px solid; display: grid; place-items: center; font: 700 9px/1 var(--f-mono); letter-spacing: .06em; }
.cell .base.b { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
.cell .base.o { border-color: var(--orange); background: var(--orange-soft); color: var(--orange); }
.cell.can { cursor: pointer; }
.cell.move::after { content: ""; position: absolute; inset: 0; background: var(--move); pointer-events: none; }
.cell.move.charge::after { box-shadow: inset 0 0 0 2px var(--move); }
.cell.spawn::after { content: ""; position: absolute; inset: 10%; border: 3px dashed var(--ink); border-radius: 8px; pointer-events: none; }
.cell .fs { position: absolute; top: 2px; right: 3px; font: 700 9px/1 var(--f-mono); color: var(--hit); z-index: 3; pointer-events: none; }
.cell.last::before { content: ""; position: absolute; inset: 3px; border: 2px dotted var(--ink); border-radius: 6px; opacity: .55; pointer-events: none; }

.token { position: relative; z-index: 1; width: 74%; height: 74%; border-radius: 50%; display: grid; place-items: center; color: var(--on-team);
  font: 800 clamp(14px, 3.4vw, 22px)/1 var(--f-display); box-shadow: 0 2px 0 rgba(0,0,0,.18); transition: transform .15s; }
.token.b { background: var(--blue); } .token.o { background: var(--orange); }
.token.done { opacity: .45; }
.token .hp { position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); display: flex; gap: 1px; }
.token .hp i { width: 5px; height: 5px; border-radius: 1px; background: var(--ink); opacity: .2; }
.token .hp i.on { opacity: 1; background: var(--ink); }
.cell.sel .token { transform: scale(1.08); box-shadow: 0 0 0 3px var(--panel), 0 0 0 6px var(--ink); }
.cell.target .token { box-shadow: 0 0 0 3px var(--panel), 0 0 0 6px var(--hit); }
.cell.target.pending .token { box-shadow: 0 0 0 3px var(--panel), 0 0 0 7px var(--hit); animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.1); } }
@media (prefers-reduced-motion: reduce) { .cell.target.pending .token { animation: none; } .token { transition: none; } }

[hidden] { display: none !important; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 70%, transparent); border-radius: 10px; }
.overlay .card { background: var(--panel); border: 2px solid var(--ink); border-radius: 12px; padding: 24px 28px; display: grid; gap: 12px; text-align: center; max-width: 80%; }
.overlay h2 { font: 800 30px/1.1 var(--f-display); margin: 0; }

/* Panel */
.panel { display: grid; gap: 16px; min-width: 0; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.side { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.side .name { font: 800 16px/1 var(--f-display); }
.side.active .name::after { content: " ●"; font-size: 11px; vertical-align: 2px; }
.vp { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 2px; }
.vp i { height: 10px; border-radius: 2px; background: var(--line); }
.side.b .vp i.on { background: var(--blue); } .side.o .vp i.on { background: var(--orange); }
.side .num { font: 700 14px/1 var(--f-mono); font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }
.side .res { grid-column: 2 / -1; font: 500 12px/1.2 var(--f-mono); color: var(--muted); }
.turnline { font: 800 19px/1.2 var(--f-display); }
.help { color: var(--muted); }
.preview { font-size: 15px; border-left: 3px solid var(--hit); padding-left: 10px; }
.preview:empty { display: none; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
button.btn { font: 700 14px/1 var(--f-body); padding: 10px 14px; border-radius: 8px; border: 1.5px solid var(--ink); background: var(--panel); color: var(--ink); cursor: pointer; }
button.btn:disabled { opacity: .35; cursor: not-allowed; }
button.btn.primary { background: var(--ink); color: var(--panel); }
button.btn.danger { border-color: var(--hit); color: var(--hit); }
button.btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.recruit { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.recruit button { display: grid; gap: 4px; justify-items: center; padding: 10px 6px; }
.recruit button small { font: 500 11px/1 var(--f-mono); color: var(--muted); }
.recruit button.on { background: var(--ink); color: var(--panel); }
.recruit button.on small { color: var(--panel); }
.label { font: 700 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.selcard h3 { margin: 0; font: 800 17px/1.2 var(--f-display); }
.selcard p { margin: 0; font-size: 14.5px; }
.stats { font: 500 13px/1.4 var(--f-mono); color: var(--muted); }
.log { max-height: 220px; overflow-y: auto; display: grid; gap: 4px; font-size: 14px; padding: 0; margin: 0; list-style: none; }
.log li { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 6px; align-items: baseline; }
.log li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.log li.b::before { background: var(--blue); } .log li.o::before { background: var(--orange); }
.log li.sys { color: var(--muted); }
.setup { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.setup label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
select { font: 15px var(--f-body); padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); min-width: 0; }
.keys { font-size: 13px; color: var(--muted); }
kbd { font: 600 12px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

@media (max-width: 820px) { .app { grid-template-columns: minmax(0, 1fr); } .boardwrap { max-width: 520px; width: 100%; margin: 0 auto; } }
</style>

<div class="app">
  <div class="top">
    <h1><span class="b">Grid</span> <span class="o">Tactics</span></h1>
    <a href="https://claude.ai/artifact/CsfiTCvEkh5Qb65qv1kRLF" target="_blank" rel="noopener">Read the rules (draft 0.4)</a>
  </div>
  <div class="boardwrap">
    <div id="board" role="grid" aria-label="Game board"></div>
    <div class="overlay" id="overlay" hidden><div class="card"><h2 id="winTitle"></h2><p id="winText"></p><div class="row" style="justify-content:center"><button class="btn primary" id="again">Play again</button></div></div></div>
  </div>
  <div class="panel">
    <div class="box" id="scores"></div>
    <div class="box">
      <div class="turnline" id="turnline"></div>
      <div class="help" id="help"></div>
      <div class="preview" id="preview" aria-live="polite"></div>
      <div class="row">
        <button class="btn danger" id="attackBtn" hidden>Attack</button>
        <button class="btn" id="skipBtn" hidden>Skip attack</button>
        <button class="btn" id="cancelBtn" hidden>Cancel</button>
        <button class="btn" id="undoBtn">Undo</button>
        <button class="btn primary" id="endBtn">End turn</button>
      </div>
    </div>
    <div class="box">
      <div class="label">Recruit (first action only)</div>
      <div class="recruit" id="recruit"></div>
    </div>
    <div class="box selcard" id="selcard" hidden></div>
    <div class="box">
      <div class="label">What happened</div>
      <ul class="log" id="log"></ul>
    </div>
    <div class="box">
      <div class="setup">
        <label for="modeSel">Players
          <select id="modeSel">
            <option value="bot0">You (Blue) vs computer</option>
            <option value="bot1">You (Orange) vs computer</option>
            <option value="hot">Two players, one screen</option>
          </select></label>
        <label for="styleSel">Computer plays
          <select id="styleSel">
            <option value="balanced">Balanced</option>
            <option value="aggressive">Aggressive</option>
            <option value="defensive">Defensive</option>
          </select></label>
      </div>
      <div class="row"><button class="btn" id="newBtn">New game</button></div>
      <div class="keys"><kbd>Esc</kbd> cancel · <kbd>U</kbd> undo · <kbd>E</kbd> end turn</div>
    </div>
  </div>
</div>

<script>
// ENGINE START: rules for draft 0.4 and the computer opponent, ported from gridsim.py. No DOM in here.
const Engine = (() => {
  const W = 8, H = 10, COLS = "abcdefgh";
  const K = (x, y) => x * 16 + y;
  const WALLS = new Set([K(1, 3), K(2, 3), K(5, 6), K(6, 6)]);
  const HIGH = new Set([K(4, 4), K(5, 4)]);
  const CPS = [[0, 5], [7, 4]];
  const BASE = [[4, 9], [3, 0]];
  const STATS = {
    B: { name: "Bruiser", hp: 6, dmg: 2, rmin: 1, rmax: 1, move: 3, both: true, value: 2 },
    S: { name: "Spearman", hp: 5, dmg: 2, rmin: 1, rmax: 1, move: 2, both: true, value: 3 },
    A: { name: "Archer", hp: 4, dmg: 2, rmin: 2, rmax: 4, move: 2, both: false, value: 4 },
  };
  const RULES = { actions: 5, cap: 6, reserve: { B: 2, S: 2, A: 2 }, vpTarget: 12, startVP: [0, 2], charge: 1, steady: 1 };
  const TEAM = ["Blue", "Orange"];
  const STYLES = {
    balanced: { aggr: 3.0, risk: 2.0, defend: 2.0, noise: 4 },
    aggressive: { aggr: 5.0, risk: 1.0, defend: 1.0, noise: 4 },
    defensive: { aggr: 1.8, risk: 3.5, defend: 4.0, noise: 4 },
  };
  const opt = { rng: Math.random, simCompat: false };

  const sq = (x, y) => COLS[x] + (H - y);
  const md = (ax, ay, bx, by) => Math.abs(ax - bx) + Math.abs(ay - by);
  const open = (x, y) => x >= 0 && x < W && y >= 0 && y < H && !WALLS.has(K(x, y));
  const nbrs = (x, y) => [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]].filter(([a, b]) => open(a, b));
  const isCP = (x, y) => CPS.some(([a, b]) => a === x && b === y);
  function bfs(sx, sy) { const d = new Map([[K(sx, sy), 0]]), q = [[sx, sy]];
    while (q.length) { const [x, y] = q.shift(); for (const [a, b] of nbrs(x, y)) if (!d.has(K(a, b))) { d.set(K(a, b), d.get(K(x, y)) + 1); q.push([a, b]); } }
    return d; }
  const DIST_TO = [bfs(...BASE[0]), bfs(...BASE[1])];

  const unitAt = (s, x, y) => s.units.find(u => u.x === x && u.y === y);
  const byId = (s, id) => s.units.find(u => u.id === id);
  const label = u => `${TEAM[u.o]} ${STATS[u.k].name}`;
  const rmax = (u, x = u.x, y = u.y) => STATS[u.k].rmax + (HIGH.has(K(x, y)) && u.k !== "B" ? 1 : 0);
  const inRange = (u, x, y, tx, ty) => { const d = md(x, y, tx, ty); return d >= STATS[u.k].rmin && d <= rmax(u, x, y); };
  const reserveLeft = (s, pl) => Object.values(s.reserve[pl]).reduce((a, b) => a + b, 0);
  const mine = (s, pl) => s.units.filter(u => u.o === pl);
  const log = (s, pl, text) => s.log.push({ pl, text, round: s.round });

  function newGame() {
    const s = { units: [], nextId: 1, vp: [...RULES.startVP], reserve: [{ ...RULES.reserve }, { ...RULES.reserve }], turn: 0, round: 1,
      actionsLeft: RULES.actions, recruited: false, anyActed: false, winner: null, how: null, cpOwner: [null, null], log: [] };
    for (const pl of [0, 1]) { const [bx, by] = BASE[pl], dy = pl === 0 ? -1 : 1;
      ["B", "S", "A"].forEach((k, i) => addUnit(s, k, pl, bx - 1 + i, by + dy)); }
    log(s, -1, "Blue moves first. Orange starts with 2 points to make up for it.");
    startTurn(s); return s;
  }
  function addUnit(s, k, o, x, y) { const u = { id: s.nextId++, k, o, x, y, hp: STATS[k].hp, moved: false, acted: false }; s.units.push(u); return u; }
  function win(s, pl, how, text) { if (s.winner !== null) return; s.winner = pl; s.how = how; log(s, pl, text); }

  function startTurn(s) {
    const pl = s.turn;
    for (const u of s.units) if (u.o === pl) { u.moved = false; u.acted = false; }
    s.actionsLeft = RULES.actions; s.recruited = false; s.anyActed = false;
    const held = CPS.filter(([x, y]) => { const u = unitAt(s, x, y); return u && u.o === pl; });
    if (held.length) { s.vp[pl] += held.length;
      log(s, pl, `${TEAM[pl]} scores ${held.length} for holding ${held.map(c => sq(...c)).join(" and ")}. Score ${s.vp[0]}–${s.vp[1]}.`); }
    CPS.forEach(([x, y], i) => { const u = unitAt(s, x, y); if (u) s.cpOwner[i] = u.o; });
    if (s.vp[pl] >= RULES.vpTarget) win(s, pl, "points", `${TEAM[pl]} reaches ${RULES.vpTarget} points and wins.`);
  }
  function endTurn(s) { if (s.winner !== null) return; s.turn = 1 - s.turn; if (s.turn === 0) s.round++; startTurn(s); }

  function checkWipe(s) {
    for (const pl of [0, 1]) if (!mine(s, pl).length && !reserveLeft(s, pl))
      win(s, 1 - pl, "wipeout", `${TEAM[pl]} has no units and no reserve left. ${TEAM[1 - pl]} wins.`);
  }
  function hit(s, t, n) { t.hp -= n; if (t.hp <= 0) s.units = s.units.filter(u => u !== t); return t.hp <= 0; }
  function markActed(s, u) { if (!u.acted) { u.acted = true; s.actionsLeft--; s.anyActed = true; } }
  function dmg(a, d, moved = 0) {
    let n = STATS[a.k].dmg, why = [];
    if (a.k === "B" && moved >= 2) { n += RULES.charge; why.push("charge"); }
    if (a.k === "A" && !d.moved) { n += RULES.steady; why.push("steady aim"); }
    return { n, why };
  }

  function spawnSquares(s, pl) { return nbrs(...BASE[pl]).filter(([x, y]) => !unitAt(s, x, y)); }
  function canRecruit(s) { const pl = s.turn;
    return s.winner === null && !s.anyActed && !s.recruited && s.actionsLeft > 0 && mine(s, pl).length < RULES.cap && reserveLeft(s, pl) > 0 && spawnSquares(s, pl).length > 0; }
  function recruit(s, k, x, y) { const pl = s.turn;
    if (!canRecruit(s) || !s.reserve[pl][k] || !spawnSquares(s, pl).some(([a, b]) => a === x && b === y)) return false;
    s.reserve[pl][k]--; addUnit(s, k, pl, x, y); s.recruited = true; s.actionsLeft--;
    log(s, pl, `${TEAM[pl]} recruits ${k === "A" ? "an" : "a"} ${STATS[k].name} on ${sq(x, y)}.`); return true; }

  function reach(s, u) {
    const occ = new Set(s.units.map(v => K(v.x, v.y))), zoc = new Set();
    for (const e of s.units) if (e.o !== u.o) for (const [a, b] of nbrs(e.x, e.y)) zoc.add(K(a, b));
    const d = new Map([[K(u.x, u.y), 0]]), q = [[u.x, u.y]], out = [{ x: u.x, y: u.y, d: 0 }];
    while (q.length) { const [x, y] = q.shift(), dd = d.get(K(x, y));
      if ((x !== u.x || y !== u.y) && zoc.has(K(x, y))) continue;
      if (dd === STATS[u.k].move) continue;
      for (const [a, b] of nbrs(x, y)) { if (d.has(K(a, b)) || occ.has(K(a, b))) continue; d.set(K(a, b), dd + 1); q.push([a, b]); out.push({ x: a, y: b, d: dd + 1 }); } }
    return out;
  }
  const targetsFrom = (s, u, x, y) => s.units.filter(e => e.o !== u.o && inRange(u, x, y, e.x, e.y));
  const firstStrikers = (s, u, x, y) => s.units.filter(e => e.o !== u.o && e.k === "S" && md(e.x, e.y, x, y) === 1);

  function move(s, u, x, y, d) {
    const from = sq(u.x, u.y); u.x = x; u.y = y; markActed(s, u);
    if (d > 0) { u.moved = true; log(s, u.o, `${label(u)} moves ${from} → ${sq(x, y)}.`);
      for (const sp of firstStrikers(s, u, x, y)) { const dead = hit(s, u, STATS.S.dmg);
        log(s, sp.o, `${label(sp)} first-strikes for ${STATS.S.dmg}${dead ? " and destroys it" : `, ${u.hp} left`}.`); if (dead) break; } }
    if (u.hp > 0 && x === BASE[1 - u.o][0] && y === BASE[1 - u.o][1]) win(s, u.o, "capture", `${label(u)} captures ${TEAM[1 - u.o]}'s base. ${TEAM[u.o]} wins.`);
    checkWipe(s); return u.hp > 0;
  }
  function attack(s, u, t, moved = 0) {
    markActed(s, u); const { n, why } = dmg(u, t, moved), dead = hit(s, t, n);
    log(s, u.o, `${label(u)} hits ${label(t)} for ${n}${why.length ? ` (${why.join(", ")})` : ""}${dead ? " and destroys it" : `, ${t.hp} left`}.`);
    if (!dead && inRange(t, t.x, t.y, u.x, u.y)) { const c = dmg(t, u), d2 = hit(s, u, c.n);
      log(s, t.o, `${label(t)} strikes back for ${c.n}${c.why.length ? ` (${c.why.join(", ")})` : ""}${d2 ? " and destroys it" : `, ${u.hp} left`}.`); }
    checkWipe(s);
  }
  function preview(s, u, t, moved = 0) {
    const { n, why } = dmg(u, t, moved), left = t.hp - n;
    let txt = `Hit the ${STATS[t.k].name} for ${n}${why.length ? ` (${why.join(", ")})` : ""}`;
    if (left <= 0) return txt + " and destroy it.";
    txt += `, leaving ${left}.`;
    if (inRange(t, t.x, t.y, u.x, u.y)) { const c = dmg(t, u).n; txt += ` It strikes back for ${c}${u.hp - c <= 0 ? ", destroying your unit." : `, leaving you ${u.hp - c}.`}`; }
    else txt += " It can't strike back.";
    return txt;
  }

  // Computer opponent: the heuristic bot from gridsim.py.
  function threatAt(s, x, y, owner) { let t = 0;
    for (const e of s.units) if (e.o !== owner && md(e.x, e.y, x, y) <= STATS[e.k].move * (STATS[e.k].both ? 1 : 0) + rmax(e)) t += STATS[e.k].dmg;
    return t; }
  function score(s, u, x, y, t, st, moved) {
    const me = u.o, foe = 1 - me; let sc = 0;
    if (t) { const n = dmg(u, t, moved).n;
      if (n >= t.hp) sc += 30 + STATS[t.k].value * 6;
      else { sc += n * 8; if (inRange(t, t.x, t.y, x, y)) sc -= dmg(t, u).n * 5; }
      if (t.x === BASE[me][0] && t.y === BASE[me][1]) sc += 120;
      if (isCP(t.x, t.y)) sc += 15 + 4 * s.vp[foe]; }
    if (isCP(x, y)) sc += 18 + 3 * s.vp[me];
    if (x === BASE[foe][0] && y === BASE[foe][1]) sc += opt.simCompat ? (threatAt(s, x, y, me) < u.hp ? 150 : 40) : 1e6;
    sc -= (DIST_TO[foe].get(K(x, y)) ?? 30) * st.aggr;
    const ci = CPS.findIndex(([a, b]) => a === x && b === y); if (ci >= 0 && s.cpOwner[ci] !== me) sc += 12;
    sc -= threatAt(s, x, y, me) * st.risk * (u.k === "A" ? 1.6 : 1);
    const intr = s.units.filter(e => e.o === foe && (DIST_TO[me].get(K(e.x, e.y)) ?? 99) <= 3);
    if (intr.length) sc -= Math.min(...intr.map(e => md(x, y, e.x, e.y))) * st.defend;
    return sc + opt.rng() * st.noise;
  }
  function bestAction(s, u, st) {
    let best = { v: -1e9, x: u.x, y: u.y, t: null, d: 0 };
    for (const p of reach(s, u)) {
      const canAtk = STATS[u.k].both || p.d === 0;
      for (const t of [null, ...(canAtk ? targetsFrom(s, u, p.x, p.y) : [])]) {
        const v = score(s, u, p.x, p.y, t, st, p.d); if (v > best.v) best = { v, x: p.x, y: p.y, t, d: p.d }; } }
    return best;
  }
  function botRecruit(s, style) {
    const pl = s.turn, n = mine(s, pl).length;
    if (!canRecruit(s) || !(n < 3 || opt.rng() < 0.7)) return false;
    const want = { A: "B", S: "A", B: "S" };
    const pool = [...s.units.filter(e => e.o !== pl).map(e => want[e.k]), "B", "S", "A"].filter(k => s.reserve[pl][k] > 0);
    if (!pool.length) return false;
    const k = pool[Math.floor(opt.rng() * pool.length)];
    const [x, y] = spawnSquares(s, pl).reduce((a, b) => (DIST_TO[1 - pl].get(K(...b)) ?? 99) < (DIST_TO[1 - pl].get(K(...a)) ?? 99) ? b : a);
    return recruit(s, k, x, y);
  }
  function botStep(s, style) {
    if (s.winner !== null || s.actionsLeft <= 0) return null;
    const live = mine(s, s.turn).filter(u => !u.acted); if (!live.length) return null;
    const st = STYLES[style]; let pick = null;
    for (const u of live) { const b = bestAction(s, u, st); if (!pick || b.v > pick.b.v) pick = { u, b }; }
    const { u, b } = pick, from = [u.x, u.y];
    const alive = move(s, u, b.x, b.y, b.d);
    if (alive && b.t && s.units.includes(b.t) && s.winner === null) attack(s, u, b.t, b.d);
    return { from, to: [b.x, b.y], id: u.id };
  }

  return { W, H, COLS, BASE, CPS, STATS, RULES, TEAM, STYLES, opt, K, WALLS, HIGH, sq, isCP, unitAt, byId, mine, reserveLeft,
    newGame, endTurn, canRecruit, recruit, spawnSquares, reach, targetsFrom, firstStrikers, move, attack, preview, botRecruit, botStep };
})();
// ENGINE END
</script>

<script>
(() => {
  const E = Engine, $ = id => document.getElementById(id);
  let S, mode = { type: "bot0", style: "balanced" }, ui, undo = [], busy = false, botTimer = null;
  const freshUi = () => ({ sel: null, phase: null, movedDist: 0, recruitKind: null, pending: null, last: [] });

  const humanTurn = () => S.winner === null && !busy && (mode.type === "hot" || S.turn === (mode.type === "bot0" ? 0 : 1));
  const T = pl => (pl === 0 ? "b" : "o");

  function newGame() {
    clearTimeout(botTimer); busy = false;
    mode = { type: $("modeSel").value, style: $("styleSel").value };
    S = E.newGame(); ui = freshUi(); undo = []; render(); maybeBot();
  }
  function snapshot() { undo.push(JSON.stringify(S)); }
  function doUndo() { if (!undo.length || !humanTurn()) return; S = JSON.parse(undo.pop()); ui = freshUi(); render(); }
  function endTurn() {
    if (!humanTurn()) return;
    E.endTurn(S); ui = freshUi(); undo = []; render(); maybeBot();
  }
  function maybeBot() {
    if (S.winner !== null || mode.type === "hot" || humanTurn()) return;
    busy = true; render();
    let first = true;
    const step = () => {
      if (first) { first = false; if (E.botRecruit(S, mode.style)) { render(); botTimer = setTimeout(step, 650); return; } }
      const r = E.botStep(S, mode.style);
      if (r) { ui.last = [r.from, r.to]; render(); botTimer = setTimeout(step, 700); return; }
      busy = false; if (S.winner === null) { E.endTurn(S); undo = []; } ui.sel = null; render();
    };
    botTimer = setTimeout(step, 600);
  }

  function selUnit() { return ui.sel ? E.byId(S, ui.sel) : null; }
  function clearSel() { ui.sel = null; ui.phase = null; ui.pending = null; ui.movedDist = 0; }
  function currentTargets(u) {
    if (!u) return [];
    if (ui.phase === "attack") return E.targetsFrom(S, u, u.x, u.y);
    if (ui.phase === "choose") return E.targetsFrom(S, u, u.x, u.y);
    return [];
  }
  function moveSquares(u) { return u && ui.phase === "choose" ? E.reach(S, u).filter(p => p.d > 0) : []; }

  function onCell(x, y) {
    if (!humanTurn()) return;
    const u = E.unitAt(S, x, y), me = S.turn, su = selUnit();
    if (ui.recruitKind) {
      if (E.spawnSquares(S, me).some(([a, b]) => a === x && b === y)) { snapshot(); E.recruit(S, ui.recruitKind, x, y); }
      ui.recruitKind = null; render(); return;
    }
    if (su) {
      const tg = currentTargets(su);
      if (u && tg.includes(u)) {
        if (ui.pending === u.id) { doAttack(su, u); } else { ui.pending = u.id; render(); }
        return;
      }
      const m = moveSquares(su).find(p => p.x === x && p.y === y);
      if (m) {
        snapshot();
        const alive = E.move(S, su, x, y, m.d);
        if (alive && S.winner === null && E.STATS[su.k].both && E.targetsFrom(S, su, su.x, su.y).length) { ui.phase = "attack"; ui.movedDist = m.d; ui.pending = null; }
        else clearSel();
        render(); return;
      }
      if (u === su && ui.phase === "choose") { clearSel(); render(); return; }
    }
    if (u && u.o === me && !u.acted && S.actionsLeft > 0) { ui.sel = u.id; ui.phase = "choose"; ui.pending = null; render(); return; }
    if (ui.phase !== "attack") { clearSel(); render(); }
  }
  function doAttack(su, t) {
    if (ui.phase === "choose") snapshot();
    E.attack(S, su, t, ui.phase === "attack" ? ui.movedDist : 0); clearSel(); render();
  }

  function render() {
    const me = S.turn, su = selUnit();
    const mv = moveSquares(su), tg = currentTargets(su);
    const spawn = ui.recruitKind ? E.spawnSquares(S, me) : [];
    const has = (arr, x, y) => arr.some(p => (p.x ?? p[0]) === x && (p.y ?? p[1]) === y);
    const board = $("board"); board.textContent = "";
    for (let y = 0; y < E.H; y++) for (let x = 0; x < E.W; x++) {
      const c = document.createElement("button"); c.className = "cell"; c.type = "button";
      if ((x + y) % 2) c.classList.add("alt");
      const wall = E.WALLS.has(E.K(x, y)); if (wall) c.classList.add("wall");
      if (E.HIGH.has(E.K(x, y))) c.classList.add("high");
      let desc = E.sq(x, y) + (wall ? ", wall" : "") + (E.HIGH.has(E.K(x, y)) ? ", high ground" : "");
      if (x === 0) c.insertAdjacentHTML("beforeend", `<span class="coord r">${E.H - y}</span>`);
      if (y === E.H - 1) c.insertAdjacentHTML("beforeend", `<span class="coord c">${E.COLS[x]}</span>`);
      if (E.isCP(x, y)) { c.insertAdjacentHTML("beforeend", `<span class="cp"></span>`); desc += ", control point"; }
      E.BASE.forEach(([bx, by], pl) => { if (bx === x && by === y) { c.insertAdjacentHTML("beforeend", `<span class="base ${T(pl)}">BASE</span>`); desc += `, ${E.TEAM[pl]} base`; } });
      const u = E.unitAt(S, x, y);
      if (u) {
        const max = E.STATS[u.k].hp;
        const tok = document.createElement("span"); tok.className = `token ${T(u.o)}` + (u.o === me && u.acted ? " done" : "");
        tok.innerHTML = `${u.k}<span class="hp">${Array.from({ length: max }, (_, i) => `<i class="${i < u.hp ? "on" : ""}"></i>`).join("")}</span>`;
        c.appendChild(tok); desc += `, ${E.TEAM[u.o]} ${E.STATS[u.k].name}, ${u.hp} of ${max} health`;
        if (su && u.id === su.id) c.classList.add("sel");
        if (tg.includes(u)) { c.classList.add("target", "can"); if (ui.pending === u.id) c.classList.add("pending"); }
        if (humanTurn() && u.o === me && !u.acted && S.actionsLeft > 0 && ui.phase !== "attack") c.classList.add("can");
      }
      const m = mv.find(p => p.x === x && p.y === y);
      if (m) { c.classList.add("move", "can"); if (su.k === "B" && m.d >= 2) c.classList.add("charge");
        if (E.firstStrikers(S, su, x, y).length) c.insertAdjacentHTML("beforeend", `<span class="fs" title="First strike">FS</span>`); }
      if (has(spawn, x, y)) c.classList.add("spawn", "can");
      if (ui.last.some(p => p[0] === x && p[1] === y)) c.classList.add("last");
      c.setAttribute("aria-label", desc);
      c.addEventListener("click", () => onCell(x, y));
      if (m) { c.addEventListener("mouseenter", () => hoverMove(su, m)); c.addEventListener("mouseleave", () => setPreview()); }
      if (u && tg.includes(u)) { c.addEventListener("mouseenter", () => setPreview(E.preview(S, su, u, ui.phase === "attack" ? ui.movedDist : 0))); c.addEventListener("mouseleave", () => setPreview()); }
      board.appendChild(c);
    }
    renderPanel(su, tg);
  }
  function hoverMove(su, m) {
    const n = E.firstStrikers(S, su, m.x, m.y).length, bits = [];
    if (n) bits.push(`Stopping here triggers first strike: ${n * 2} damage before you can attack.`);
    if (su.k === "B" && m.d >= 2) bits.push("Charge is ready: your attack will deal 3.");
    if (su.k === "A") bits.push("Archers can't shoot after moving.");
    setPreview(bits.join(" "));
  }
  function setPreview(txt = "") {
    const su = selUnit(), p = ui.pending && E.byId(S, ui.pending);
    $("preview").textContent = txt || (su && p ? E.preview(S, su, p, ui.phase === "attack" ? ui.movedDist : 0) : "");
  }

  function renderPanel(su, tg) {
    const me = S.turn;
    $("scores").innerHTML = [0, 1].map(pl => {
      const r = S.reserve[pl], who = mode.type === "hot" ? "" : (pl === (mode.type === "bot0" ? 0 : 1) ? " (you)" : " (computer)");
      return `<div class="side ${T(pl)} ${S.winner === null && me === pl ? "active" : ""}">
        <span class="name ${pl ? "orange" : "blue"}" style="color:var(--${pl ? "orange" : "blue"})">${E.TEAM[pl]}</span>
        <div class="vp" aria-label="${S.vp[pl]} of 12 points">${Array.from({ length: 12 }, (_, i) => `<i class="${i < S.vp[pl] ? "on" : ""}"></i>`).join("")}</div>
        <span class="num">${S.vp[pl]}/12</span>
        <span class="res">Reserve: ${r.B} Bruiser · ${r.S} Spearman · ${r.A} Archer · ${E.mine(S, pl).length}/6 on board${who}</span></div>`;
    }).join("");
    const bot = S.winner === null && !humanTurn();
    $("turnline").textContent = S.winner !== null ? `${E.TEAM[S.winner]} wins` :
      `Round ${S.round} · ${E.TEAM[me]}'s turn · ${S.actionsLeft} action${S.actionsLeft === 1 ? "" : "s"} left`;
    $("turnline").style.color = `var(--${me ? "orange" : "blue"})`;
    let help;
    if (S.winner !== null) help = "Start a new game below, or press Play again.";
    else if (bot) help = "The computer is playing its turn…";
    else if (ui.recruitKind) help = `Pick a dashed square next to your base to place the ${E.STATS[ui.recruitKind].name}.`;
    else if (ui.phase === "attack") help = tg.length ? "Tap a ringed enemy to see the result, tap again to attack. Or skip the attack." : "";
    else if (su) help = su.k === "A" ? "Move to a shaded square, or shoot a ringed enemy. Archers can't do both."
      : "Move to a shaded square (you can attack after), or attack a ringed enemy from here.";
    else if (S.actionsLeft <= 0 || !E.mine(S, me).some(u => !u.acted)) help = "Nothing left to do. End your turn.";
    else help = "Pick one of your units to activate" + (E.canRecruit(S) ? ", or recruit first." : ".");
    $("help").textContent = help;
    setPreview();
    $("attackBtn").hidden = !(ui.pending && humanTurn());
    $("skipBtn").hidden = !(ui.phase === "attack" && humanTurn());
    $("cancelBtn").hidden = !((ui.phase === "choose" || ui.recruitKind) && humanTurn());
    $("undoBtn").disabled = !(undo.length && humanTurn());
    $("endBtn").disabled = !humanTurn();
    $("endBtn").textContent = humanTurn() && S.actionsLeft > 0 && E.mine(S, me).some(u => !u.acted) ? `End turn (${S.actionsLeft} unused)` : "End turn";

    const rc = $("recruit"); rc.textContent = "";
    for (const k of ["B", "S", "A"]) {
      const b = document.createElement("button"); b.className = "btn" + (ui.recruitKind === k ? " on" : ""); b.type = "button";
      b.disabled = !(humanTurn() && E.canRecruit(S) && S.reserve[me][k] > 0);
      b.innerHTML = `${E.STATS[k].name}<small>${S.reserve[me][k]} left</small>`;
      b.addEventListener("click", () => { ui.recruitKind = ui.recruitKind === k ? null : k; clearSel(); render(); });
      rc.appendChild(b);
    }
    const card = $("selcard");
    const show = su || (ui.pending && E.byId(S, ui.pending));
    card.hidden = !su;
    if (su) {
      const st = E.STATS[su.k];
      const abil = { B: "Charge: 3 damage if it moved 2+ squares this action.", S: "First strike: hits any enemy that stops next to it for 2.", A: "Steady aim: 3 damage to a unit that didn't move last turn. Can't hit adjacent units." }[su.k];
      card.innerHTML = `<div class="label">Selected</div><h3>${E.TEAM[su.o]} ${st.name} · ${su.hp}/${st.hp} health</h3>
        <div class="stats">Damage ${st.dmg} · Range ${st.rmin === st.rmax ? st.rmin : st.rmin + "–" + st.rmax} · Move ${st.move} · ${st.both ? "move + attack" : "move or attack"}</div><p>${abil}</p>`;
    }
    const lg = $("log");
    lg.innerHTML = S.log.slice(-40).reverse().map(e => `<li class="${e.pl < 0 ? "sys" : T(e.pl)}">${e.text}</li>`).join("");
    const ov = $("overlay");
    ov.hidden = S.winner === null;
    if (S.winner !== null) {
      $("winTitle").textContent = `${E.TEAM[S.winner]} wins`; $("winTitle").style.color = `var(--${S.winner ? "orange" : "blue"})`;
      $("winText").textContent = { capture: "Base captured", points: "12 points reached", wipeout: "Enemy army wiped out" }[S.how] + ` in round ${S.round}. Final score ${S.vp[0]}–${S.vp[1]}.`;
    }
  }

  $("attackBtn").addEventListener("click", () => { const su = selUnit(), t = ui.pending && E.byId(S, ui.pending); if (su && t && humanTurn()) doAttack(su, t); });
  $("skipBtn").addEventListener("click", () => { clearSel(); render(); });
  $("cancelBtn").addEventListener("click", () => { ui.recruitKind = null; if (ui.phase === "choose") clearSel(); render(); });
  $("undoBtn").addEventListener("click", doUndo);
  $("endBtn").addEventListener("click", endTurn);
  $("newBtn").addEventListener("click", newGame);
  $("again").addEventListener("click", newGame);
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "SELECT") return;
    if (e.key === "Escape") { ui.recruitKind = null; if (ui.phase !== "attack") clearSel(); else clearSel(); render(); }
    else if (e.key === "u" || e.key === "U") doUndo();
    else if (e.key === "e" || e.key === "E") endTurn();
  });

  const hot = window.claude?.hot;
  hot?.snapshot?.(() => ({ S, mode, undo }));
  const start = data => {
    if (data && data.S) { S = data.S; mode = data.mode; undo = data.undo || []; $("modeSel").value = mode.type; $("styleSel").value = mode.style; ui = freshUi(); render(); maybeBot(); }
    else newGame();
  };
  hot?.ready ? hot.ready(start) : start(hot?.data ?? {});
})();
</script>
